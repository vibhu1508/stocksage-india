<header class="sticky top-0 z-40 w-full border-b border-border bg-background/95 backdrop-blur supports-[backdrop-filter]:bg-background/80 transition-all duration-300" [class.-translate-y-full]="!showHeader">
  <div class="flex h-16 items-center px-4 md:px-6 justify-between lg:justify-end gap-4 w-full">
    
    <!-- Mobile left spacer (sidebar toggle takes up space visually via position fixed, but here we just need spacing) -->
    <div class="lg:hidden w-10"></div>

    <!-- Favicon Search -->
    <div class="relative w-full max-w-[280px] lg:max-w-sm hidden md:flex items-center flex-1 lg:flex-none mr-auto ml-12 lg:ml-4 lg:mr-4">
      <div class="absolute left-2.5 flex h-5 w-5 items-center justify-center rounded-sm bg-primary/15 text-primary text-[10px] font-black leading-none select-none">
        S
      </div>
      <input
             type="text"
             [(ngModel)]="searchQuery"
             (input)="onSearchInput()"
             (focus)="showSuggestions = suggestions.length > 0"
             (blur)="hideSuggestions()"
             (keydown.enter)="submitSearch()"
             placeholder="Search stocks..."
             class="h-9 w-full rounded-md border border-input bg-background/50 pl-9 pr-12 py-1 text-sm shadow-sm transition-all placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring focus:bg-background" />
      <kbd class="pointer-events-none absolute right-2.5 flex h-5 select-none items-center gap-1 rounded border bg-muted px-1.5 font-mono text-[9px] font-medium opacity-100 text-muted-foreground">
        <span class="text-[10px]">⌘</span>K
      </kbd>

      @if (showSuggestions && suggestions.length > 0) {
      <div class="absolute top-[calc(100%+6px)] left-0 right-0 rounded-md border border-border bg-popover text-popover-foreground shadow-md max-h-72 overflow-y-auto z-50">
        @for (s of suggestions; track s.symbol) {
        <button type="button" (mousedown)="selectSuggestion(s.symbol)" class="w-full text-left px-3 py-2 border-b border-border/50 last:border-b-0 hover:bg-accent/70 transition-colors">
          <div class="text-xs font-bold text-primary">{{ s.symbol }}</div>
          <div class="text-[11px] text-muted-foreground truncate">{{ s.name }}</div>
        </button>
        }
      </div>
      }
    </div>

    <!-- Right Actions -->
    <div class="flex items-center gap-2">
      @if (timeParts$ | async; as tp) {
      <div class="hidden sm:flex items-center justify-center px-3 py-1.5 rounded-md border border-border bg-muted/30 text-xs font-mono font-bold text-foreground whitespace-nowrap mr-2">
        <span class="text-primary mr-1">{{ tp.hours }}</span>:<span>{{ tp.minutes }}</span><span class="text-muted-foreground/60 ml-1 text-[10px]">{{ tp.ampm }}</span>
      </div>
      }

      <div class="hidden sm:flex items-center justify-center px-3 py-1.5 rounded-md border border-border bg-muted/30 text-xs font-medium text-muted-foreground whitespace-nowrap mr-2">
        <span class="mr-1 inline-block w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
        {{ (timeParts$ | async) ? (clockService.currentTime$ | async | date:'EEE, MMM d') : '' }}
      </div>

      <!-- Theme Toggle -->
      <button (click)="toggleTheme()" 
              class="flex items-center justify-center h-9 w-9 rounded-md border border-input bg-background hover:bg-accent hover:text-accent-foreground transition-colors shadow-sm">
        <lucide-icon [name]="themeService.isDark ? 'sun' : 'moon'" [size]="18" class="text-foreground"></lucide-icon>
      </button>

      <!-- Notifications -->
      <button class="flex items-center justify-center h-9 w-9 rounded-md border border-input bg-background hover:bg-accent hover:text-accent-foreground transition-colors shadow-sm relative">
        <lucide-icon name="bell" [size]="18" class="text-foreground"></lucide-icon>
        <span class="absolute top-2 right-2 flex h-2 w-2 rounded-full bg-destructive"></span>
      </button>

      <!-- Logout -->
      <button (click)="logout()" 
              class="ml-2 flex items-center justify-center h-9 px-3 rounded-md bg-primary text-primary-foreground text-sm font-medium hover:bg-primary/90 transition-colors shadow-sm gap-2">
        <lucide-icon name="log-out" [size]="16"></lucide-icon>
        <span class="hidden sm:inline">Logout</span>
      </button>
    </div>

  </div>
</header>
