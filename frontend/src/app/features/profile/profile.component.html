<div class="mx-auto w-full max-w-4xl fade-in">
  <div class="rounded-xl border border-border bg-card text-card-foreground shadow-sm overflow-hidden">
    <div class="bg-muted/35 border-b border-border px-6 py-5 md:px-8">
      <div class="flex items-center justify-between gap-3">
        <div>
          <p class="text-xs font-semibold uppercase tracking-wide text-muted-foreground">Account</p>
          <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight" style="font-family: 'Plus Jakarta Sans', sans-serif;">Profile Settings</h1>
          <p class="text-sm text-muted-foreground mt-1">Manage your personal details used across StockSage India.</p>
        </div>
        <div class="flex h-11 w-11 items-center justify-center rounded-lg bg-primary/10 text-primary">
          <lucide-icon name="user-cog" [size]="22"></lucide-icon>
        </div>
      </div>
    </div>

    @if (loading) {
      <div class="p-8 md:p-10">
        <div class="animate-pulse space-y-4">
          <div class="h-5 w-44 rounded bg-muted"></div>
          <div class="h-10 rounded bg-muted"></div>
          <div class="h-5 w-40 rounded bg-muted mt-6"></div>
          <div class="h-10 rounded bg-muted"></div>
          <div class="h-24 rounded bg-muted"></div>
        </div>
      </div>
    } @else {
      <form class="p-6 md:p-8 grid grid-cols-1 md:grid-cols-2 gap-5" (ngSubmit)="saveProfile()">
        <div>
          <label class="block text-xs font-semibold text-muted-foreground mb-1 uppercase">Full Name</label>
          <input
            type="text"
            [value]="user?.name || ''"
            readonly
            class="w-full rounded-lg border border-border bg-muted/30 px-3 py-2 text-sm text-muted-foreground cursor-not-allowed"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold text-muted-foreground mb-1 uppercase">Email (read-only)</label>
          <input
            type="email"
            [value]="user?.email || ''"
            readonly
            class="w-full rounded-lg border border-border bg-muted/30 px-3 py-2 text-sm text-muted-foreground cursor-not-allowed"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold text-muted-foreground mb-1 uppercase">Mobile Number</label>
          <input
            type="tel"
            [(ngModel)]="form.phone"
            name="phone"
            placeholder="e.g. 9876543210"
            class="w-full rounded-lg border border-border bg-background px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-primary/40"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold text-muted-foreground mb-1 uppercase">Occupation</label>
          <input
            type="text"
            [(ngModel)]="form.occupation"
            name="occupation"
            placeholder="e.g. Engineer, Trader, Student"
            class="w-full rounded-lg border border-border bg-background px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-primary/40"
          />
        </div>

        <div class="md:col-span-2">
          <label class="block text-xs font-semibold text-muted-foreground mb-1 uppercase">Address</label>
          <textarea
            [(ngModel)]="form.address"
            name="address"
            rows="3"
            placeholder="City, state, country"
            class="w-full rounded-lg border border-border bg-background px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-primary/40"
          ></textarea>
        </div>

        <div>
          <label class="block text-xs font-semibold text-muted-foreground mb-1 uppercase">Trading Experience</label>
          <select
            [(ngModel)]="form.trading_experience"
            name="trading_experience"
            class="w-full rounded-lg border border-border bg-background px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-primary/40"
          >
            <option>Beginner</option>
            <option>Intermediate</option>
            <option>Advanced</option>
          </select>
        </div>

        <div class="md:col-span-2 flex items-center justify-between gap-3 pt-2 border-t border-border mt-2 pt-4">
          <div>
            @if (error) {
              <p class="text-sm text-red-500">{{ error }}</p>
            }
            @if (success) {
              <p class="text-sm text-emerald-600">{{ success }}</p>
            }
          </div>

          <button
            type="submit"
            [disabled]="saving"
            class="px-4 py-2 rounded-lg bg-primary text-primary-foreground text-sm font-semibold hover:opacity-90 disabled:opacity-60"
          >
            {{ saving ? 'Saving...' : 'Save Changes' }}
          </button>
        </div>
      </form>
    }
  </div>
</div>
