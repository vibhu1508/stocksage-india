<div class="min-h-screen bg-background text-foreground flex w-full overflow-hidden">
  @if (authService.isAuthenticated()) {
  <app-sidebar (collapsedChange)="sidebarCollapsed = $event"></app-sidebar>
  <div class="flex-1 flex flex-col min-h-screen transition-all duration-300 w-full">
    <app-header></app-header>
    <main class="flex-1 p-4 md:p-6 lg:p-8 w-full overflow-x-hidden">
      <router-outlet></router-outlet>
    </main>
  </div>
  } @else {
  <main class="flex-1 min-h-screen w-full flex items-center justify-center bg-muted/30">
    <router-outlet></router-outlet>
  </main>
  }
</div>
