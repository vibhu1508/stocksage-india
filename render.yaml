services:
  - type: web
    name: stocksage-india-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stocksage-india-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://stocksage-india-backend.onrender.com/api/auth/google/callback
      - key: FRONTEND_URL
        value: https://stocksageindia.vercel.app

databases:
  - name: stocksage-india-db
    databaseName: stocksage_india
    user: stocksage
    plan: free
